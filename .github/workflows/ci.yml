name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]

    steps:
      - uses: actions/checkout@v7

      # -Werror here and not in the Makefile on purpose: a warning should stop
      # CI, but it should not stop someone mid-edit on their own machine.
      # Two compilers because they disagree about what is worth warning on, and
      # the disagreements are usually the interesting ones.
      - name: Build
        run: make CXX=${{ matrix.cxx }} CXXFLAGS="-std=c++17 -Wall -Wextra -Werror -O2"

      # Deliberately `make run` rather than ./renderer directly. The Makefile's
      # own recipes -- the mkdir, the stale-frame delete, the POSIX branch of
      # the $(OS) split -- are code too, and code that nothing exercises rots.
      - name: Render via the Makefile
        run: make run CXX=${{ matrix.cxx }} CXXFLAGS="-std=c++17 -Wall -Wextra -Werror -O2"

      # Nothing here is hardcoded to a resolution or a frame count: both are
      # read back out of the output. Changing FRAME_COUNT or the viewport
      # constants should not break CI for an unrelated reason.
      #
      # The distinct-value check is the one that matters. A broken transform, an
      # empty draw loop or an inverted depth test all still write perfectly
      # well-formed PPMs -- of flat background grey. Structure alone cannot tell
      # the difference; the number of distinct channel values can.
      - name: Validate output
        run: |
          python3 - <<'PY'
          import glob, sys, os

          frames = sorted(glob.glob("frames/*.ppm"))
          assert frames, "no frames were rendered"
          print(f"frames rendered: {len(frames)}")

          sizes = {os.path.getsize(f) for f in frames}
          assert len(sizes) == 1, f"frames differ in size: {sorted(sizes)}"

          # Sample the middle of the sequence: frame 0 could be a degenerate
          # pose, and the last one is the same pose as the first.
          probe = frames[len(frames) // 2]
          with open(probe, "rb") as fh:
              data = fh.read()

          assert data[:2] == b"P6", f"{probe} is not a binary PPM"
          header_end = 0
          for _ in range(3):                       # magic, dimensions, maxval
              header_end = data.index(b"\n", header_end) + 1
          w, h = (int(v) for v in data[3:header_end].split()[:2])
          expected = header_end + w * h * 3
          assert len(data) == expected, f"{probe}: {len(data)} bytes, expected {expected}"
          print(f"{probe}: {w}x{h}, {len(data)} bytes, header {header_end}")

          distinct = len(set(data[header_end:]))
          print(f"distinct channel values: {distinct}")
          assert distinct > 16, "frame is nearly flat -- geometry or transform is broken"
          PY

      - name: make clean removes what it built
        run: |
          make clean
          test ! -e renderer
          test -z "$(ls *.o 2>/dev/null)"

      - name: Free the frames
        if: always()
        run: rm -rf frames

  tooling:
    name: docs, graphs and encoders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install doxygen, graphviz and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz ffmpeg

      # Warnings are printed and uploaded rather than failing the job: a
      # doxygen version bump can deprecate a tag and produce a warning that says
      # nothing about this code. A non-zero exit or a missing index.html does
      # fail, because that means the docs did not build at all.
      # Checks the landing page has CONTENT, not that the file exists. Without a
      # @mainpage block Doxygen happily emits an index.html carrying a title and
      # nothing else -- which passes `test -f` while telling a visitor nothing,
      # and this site is linked from the README as somewhere worth going.
      - name: make docs
        run: |
          make docs 2>doxygen-warnings.txt || true
          cat doxygen-warnings.txt
          test -f docs/html/index.html
          python3 - <<'PY'
          import re, sys
          html = open("docs/html/index.html", encoding="utf-8").read()
          text = " ".join(re.sub(r"<[^>]+>", " ", html).split())
          print(f"landing page: {len(text)} characters of visible text")
          assert len(text) > 1500, "index.html is a stub -- is the @mainpage block still there?"
          for probe in ("The pipeline", "Where to start reading"):
              assert probe in html, f"main page is missing its '{probe}' section"
          print("landing page has content")
          PY

      # Redraws the README's graphs from their .dot sources. Checks the sources
      # are valid without comparing against the committed PNGs -- those are not
      # byte-reproducible across graphviz versions, so diffing them would fail
      # for reasons that have nothing to do with the graphs.
      - name: make graphs
        run: |
          make graphs
          test -s Media/Graphs/include_graph_light.png
          test -s Media/Graphs/work_amplification_dark.png

      # video and gif were the least tested and most fragile targets: the ffmpeg
      # frame pattern needs %% on Windows and % elsewhere, and a mistake there
      # produces a silent no-op rather than an error.
      - name: make video and make gif
        run: |
          make video gif
          ls -l Media/Videos/torus_gouraud_shading.mp4 Media/Gifs/torus_gouraud_shading.gif
          test "$(stat -c%s Media/Videos/torus_gouraud_shading.mp4)" -gt 100000
          test "$(stat -c%s Media/Gifs/torus_gouraud_shading.gif)" -gt 100000

      - name: Free the frames
        if: always()
        run: rm -rf frames

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-html
          path: docs/html
          retention-days: 14

  sanitizers:
    name: address and undefined behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Worth more than a unit test here, because it finds the bugs nobody
      # thought to write a test for. Two classes this project is exposed to by
      # construction: unchecked framebuffer writes behind a bounding box that
      # must be clamped, and OBJ indices taken from a file and used directly as
      # array subscripts. ASan catches the first, UBSan the second.
      #
      # LIMIT: only the model main.cpp names gets rendered, so this exercises
      # the bundled torus. It would catch a malformed downloaded mesh the day
      # one is pointed at.
      - name: Build with ASan and UBSan
        run: |
          make CXXFLAGS="-std=c++17 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Render under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          make run CXXFLAGS="-std=c++17 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Free the frames
        if: always()
        run: rm -rf frames

  divergence:
    name: -O0 vs -O2 output divergence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Renders the same frames at two optimisation levels and measures how far
      # apart they land. Undefined behaviour is the thing that changes character
      # across -O levels, so a large divergence here is a real signal.
      #
      # It is NOT an exact-match check, and that distinction is the point. With
      # -ffp-contract=off on both builds, -O0 and -O2 still disagree on about
      # two pixels per frame by one LSB: different instruction selection gives a
      # last-bit difference in a float, and the truncating uint8_t cast in the
      # colour write turns that into a whole integer step. Expected, and harmless.
      #
      # The same fact is why the eventual RTL comparison needs a tolerance
      # rather than a hash: if two builds of ONE compiler from ONE source cannot
      # agree bit-for-bit, a fixed-point pipeline certainly will not.
      - name: Render at -O0 and -O2
        run: |
          for opt in O0 O2; do
            make clean
            make CXXFLAGS="-std=c++17 -ffp-contract=off -$opt"
            make run CXXFLAGS="-std=c++17 -ffp-contract=off -$opt"
            mkdir -p "cmp/$opt"
            for f in 000 060 119; do cp "frames/$f.ppm" "cmp/$opt/"; done
            rm -rf frames
          done

      - name: Measure the divergence
        run: |
          python3 - <<'PY'
          import sys

          def pixels(path):
              data = open(path, "rb").read()
              i = 0
              for _ in range(3):
                  i = data.index(b"\n", i) + 1
              return data[i:]

          # The DELTA is the real gate. A pixel off by one LSB is rounding: two
          # builds of one compiler select different instruction sequences, the
          # last bit of a float differs, and the truncating uint8_t cast in the
          # colour write turns that into a whole integer step. A pixel off by
          # more than that is not rounding, and that is what this job exists to
          # catch.
          #
          # The FRACTION is a backstop, not a correctness signal. How many
          # pixels sit within 1 LSB is a property of how many happen to land
          # near a rounding boundary -- it moves with the scene and with the
          # arithmetic, not with correctness. Measured: 2 pixels per frame on
          # the old affine path over a 1600-triangle torus, and ~115,000 (5.5%)
          # on the current perspective-correct path over the 3,636-triangle
          # solids scene. Both have max delta 1. The extra reciprocal and three
          # multiplies per fragment give a last-bit difference many more places
          # to land, and the scene has far more smooth gradient in it.
          #
          # So the fraction limit sits well above that, only wide enough to
          # catch a wholesale change of image -- which would show up in the
          # delta anyway.
          MAX_DELTA    = 2        # one LSB of rounding, with a little headroom
          MAX_FRACTION = 0.25     # backstop only; see above

          failed = False
          for frame in ("000", "060", "119"):
              a = pixels(f"cmp/O0/{frame}.ppm")
              b = pixels(f"cmp/O2/{frame}.ppm")
              assert len(a) == len(b), f"{frame}: frames differ in size"

              count = len(a) // 3
              differing = 0
              worst = 0
              for p in range(count):
                  i = p * 3
                  d = max(abs(a[i + c] - b[i + c]) for c in range(3))
                  if d:
                      differing += 1
                  if d > worst:
                      worst = d

              fraction = differing / count
              print(f"frame {frame}: {differing} of {count} pixels differ "
                    f"({fraction * 100:.5f}%), max channel delta {worst}")

              if worst > MAX_DELTA:
                  print(f"  FAIL: max delta {worst} exceeds {MAX_DELTA} -- beyond "
                        f"rounding. Suspect undefined behaviour or an "
                        f"optimisation-sensitive bug.")
                  failed = True
              elif fraction > MAX_FRACTION:
                  print(f"  FAIL: {fraction * 100:.2f}% of pixels differ, over the "
                        f"{MAX_FRACTION * 100:.0f}% backstop. Every difference is "
                        f"within rounding, so this is a change of scene or of "
                        f"arithmetic rather than a bug -- recheck and re-baseline.")
                  failed = True

          sys.exit(1 if failed else 0)
          PY

      - name: Free the frames
        if: always()
        run: rm -rf frames cmp
